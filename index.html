
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulário de acesso</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #fff;
            color: #202124;
            display: flex;
            flex-direction: column;
        }

        .top {
            text-align: center;
            padding: 12px;
            background: #fef7e0;
            color: #5f4700;
            font-size: 12px;
            font-weight: 600;
        }

        main {
            width: min(100% - 32px, 450px);
            margin: 48px auto 25px;
            padding: 38px 36px;
            border: 1px solid #dadce0;
            border-radius: 18px;
            text-align: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -.6px;
        }

        .blue { color: #4285f4; }
        .red { color: #ea4335; }
        .yellow { color: #fbbc05; }
        .green { color: #34a853; }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 400;
        }

        .subtitle {
            margin: 0 0 26px;
            font-size: 15px;
            line-height: 1.5;
        }

        label {
            display: block;
            width: 100%;
            margin: 18px 0 8px;
            text-align: left;
            font-size: 13px;
        }

        input {
            display: block;
            width: 100%;
            height: 48px;
            margin-bottom: 18px;
            padding: 0 14px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            background: #fff;
            color: #202124;
            font-family: Arial, sans-serif;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border: 2px solid #1a73e8;
            padding: 0 13px;
        }

        input::placeholder {
            color: #80868b;
        }

        .help {
            margin-top: 18px;
            text-align: left;
            font-size: 12px;
            color: #5f6368;
            line-height: 1.5;
        }

        button {
            width: 100%;
            margin-top: 26px;
            padding: 13px;
            border: 0;
            border-radius: 5px;
            background: #1a73e8;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1765cc;
        }

        button:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #e8f0fe;
            color: #174ea6;
            font-size: 13px;
            line-height: 1.5;
            text-align: left;
        }

        footer {
            width: min(100% - 32px, 450px);
            margin: 0 auto 30px;
            text-align: center;
            color: #5f6368;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            main {
                margin-top: 24px;
                padding: 28px 22px;
                border: none;
            }
        }
    </style>
</head>

<body>
    <div class="top">
        Formulário de demonstração
    </div>

    <main>
        <div class="logo">
            <span class="blue">P</span><span class="red">o</span><span class="yellow">r</span><span class="blue">t</span><span class="green">a</span><span class="red">l</span>
        </div>

        <h1>Preencha seus dados</h1>
        <p class="subtitle">
            Informe seu e-mail e sua idade para continuar.
        </p>

        <form id="formulario">
            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
                maxlength="254"
            >

            <label for="idade">Idade</label>
            <input
                type="number"
                id="idade"
                name="idade"
                placeholder="Digite sua idade"
                min="1"
                max="120"
                required
            >

            <p class="help">
                Demonstração de formulário. Informe dados fictícios
                durante os testes.
            </p>

            <button id="enviar" type="submit">
                Enviar
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
    </main>

    <footer>
        Formulário de demonstração independente
    </footer>

    <script>
        const formulario = document.getElementById("formulario");
        const botao = document.getElementById("enviar");
        const mensagem = document.getElementById("message");

        formulario.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!formulario.reportValidity()) {
                return;
            }

            botao.disabled = true;
            mensagem.style.display = "block";
            mensagem.textContent = "Registrando dados...";

            try {
                const resposta = await fetch("/evento", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        idade: document.getElementById("idade").value
                    })
                });

                const resultado = await resposta.json();

                if (!resposta.ok) {
                    throw new Error(
                        resultado.erro || "Não foi possível registrar."
                    );
                }

                mensagem.textContent =
                    "Dados registrados com sucesso!";

                formulario.reset();

            } catch (erro) {
                mensagem.textContent =
                    "Erro ao registrar. Confira se o servidor está funcionando.";

                console.error(erro);
            } finally {
                botao.disabled = false;
            }
        });
    </script>
</body>
</html>
